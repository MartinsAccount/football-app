<!DOCTYPE html>
<html lang="hu">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" />
		<!-- Téma festés ELŐTT (nincs villanás; DESIGN §3.1). Sorrend: ?theme= → localStorage['oe-theme'] → rendszer. A meta színét a ThemeStore állítja. -->
		<script>
			(function () {
				var k = 'oe-theme',
					q = null,
					p = null;
				try {
					q = new URLSearchParams(location.search).get('theme');
				} catch (e) {}
				try {
					p = localStorage.getItem(k);
				} catch (e) {}
				var pick = q === 'light' || q === 'dark' ? q : p;
				var t =
					pick === 'light' || pick === 'dark'
						? pick
						: window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
						? 'light'
						: 'dark';
				document.documentElement.dataset.theme = t;
			})();
		</script>
		<meta name="description" content="Meccselemzés, értékes tippek és kiértékelés" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<link rel="manifest" href="/manifest.json" />
		<title>Odds elemző</title>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
		<script type="module" src="/src/index.tsx"></script>
	</body>
</html>
